server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 201m;

  # 前端 SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 反代后端
  location /api/ {
    proxy_pass http://api:8081/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
